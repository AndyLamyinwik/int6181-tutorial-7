name: Python tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: unittest (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run teacher tests
        run: python -m unittest discover -v
